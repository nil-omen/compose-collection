configs:
    ts-serve:
        content: |
            {"TCP":{"443":{"HTTPS":true}},
            "Web":{"$${TS_CERT_DOMAIN}:443":
              {"Handlers":{"/":
              {"Proxy":"http://127.0.0.1:5001"}}}},
            "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
    # Make sure you have updated/checked the .env file with the correct variables.
    # All the ${ xx } need to be defined there.
    # Tailscale Sidecar Configuration
    tailscale:
        image: tailscale/tailscale:latest # Image to be used
        container_name: ts-${SERVICE} # Name for local container management
        hostname: ${SERVICE} # Name used within your Tailscale environment
        environment:
            - TS_AUTHKEY=${TS_AUTHKEY}
            - TS_STATE_DIR=/var/lib/tailscale
            - TS_SERVE_CONFIG=/config/serve.json # Tailscale Serve configuration to expose the web interface on your local Tailnet
            - TS_USERSPACE=false
            - TS_ENABLE_HEALTH_CHECK=true # Enable healthcheck endpoint: "/healthz"
            - TS_LOCAL_ADDR_PORT=127.0.0.1:41234 # The <addr>:<port> for the healthz endpoint
            #- TS_ACCEPT_DNS=true # Uncomment when using MagicDNS
            - TS_AUTH_ONCE=true
        configs:
            - source: ts-serve
              target: /config/serve.json
        volumes:
            - ${DATA_DIR}/${SERVICE}/ts/config:/config # Config folder used to store Tailscale files
            - ${DATA_DIR}/${SERVICE}/ts/state:/var/lib/tailscale # Tailscale requirement
        devices:
            - /dev/net/tun:/dev/net/tun # Network configuration for Tailscale to work
        cap_add:
            - net_admin # Tailscale requirement
        #ports:
        #  - 0.0.0.0:${SERVICEPORT}:${SERVICEPORT} # Binding port ${SERVICEPORT} to the local network - uncomment if you want LAN access too
        # If any DNS issues arise, use your preferred DNS provider by uncommenting the config below
        # dns:
        #   - ${DNS_SERVER}
        healthcheck:
            test: [
                    "CMD",
                    "wget",
                    "--spider",
                    "-q",
                    "http://127.0.0.1:41234/healthz",
                ] # Check Tailscale has a Tailnet IP and is operational
            interval: 1m
            timeout: 10s
            retries: 3
            start_period: 10s
        restart: unless-stopped

    # ${SERVICE} (Dockge Application)
    application:
        image: ${IMAGE_URL} # Image to be used (louislam/dockge:1)
        network_mode: service:tailscale # Route Dockge entirely through the Tailscale container
        container_name: app-${SERVICE}
        environment:
            # Tell Dockge where your stacks directory is located
            - DOCKGE_STACKS_DIR=${STACKS_DIR}
            - DOCKGE_ENABLE_CONSOLE=true
        volumes:
            # Required to let Dockge interact with the Docker daemon
            - /var/run/docker.sock:/var/run/docker.sock
            # Dockge's internal database/app data
            - ${DATA_DIR}/${SERVICE}/data:/app/data
            # Stacks Directory
            # ⚠️ READ IT CAREFULLY.
            # ⚠️ 1. FULL path only. No relative path (MUST)
            # ⚠️ 2. Left Stacks Path === Right Stacks Path (MUST)
            - ${STACKS_DIR}:${STACKS_DIR}
        depends_on:
            tailscale:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://127.0.0.1:41234/healthz"]
            interval: 1m
            timeout: 10s
            retries: 3
            start_period: 30s
        restart: unless-stopped
